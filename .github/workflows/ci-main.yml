name: CI Main + Release

on:
  pull_request:
    branches: [main]
    types: [closed]

jobs:
  ci-sast-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      security-events: write
    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_TOKEN_MGMT_CLIENT_ID }}
          private-key: ${{ secrets.APP_TOKEN_MGMT_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      
      - run: npm ci

      # Lint + Build
      - run: npm run lint
      - run: npm run build

      # npm audit
      - name: Security audit
        run: npm audit --audit-level=high || true

      # CodeQL SAST
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      # Bump de versão e criação de tag
      - name: Bump version and tag
        run: |
          git config user.name "sofia-pr-approver[bot]"
          git config user.email "206593691+sofia-pr-approver[bot]@users.noreply.github.com"
          npx commit-and-tag-version
          git push origin main --follow-tags
